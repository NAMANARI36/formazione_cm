---

- name: Deploya la unit Quadlet del registry
  ansible.builtin.template:
    src: registry.container.j2
    dest: "/etc/containers/systemd/{{ registry_name }}.container"
    owner: root
    group: root
    mode: "0644"
  notify: Ricarica systemd daemon

- name: Applica le unit Quadlet
  ansible.builtin.meta: flush_handlers

- name: Configura la VM per segnalare gli endpoint del registry come insecure, abilitando il push e il pull senza TLS
  ansible.builtin.copy:
    dest: /etc/containers/registries.conf.d/10-local-registry.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      {% for ep in registry_insecure_endpoints %}
      [[registry]]
      location = "{{ ep }}"
      insecure = true

      {% endfor %}

- name: Avvia il registry
  ansible.builtin.systemd:
    name: "{{ registry_name }}.service"
    state: started

- name: Attendo l'avvio del registry
  ansible.builtin.wait_for:
    port: "{{ registry_port }}"
    host: localhost
    timeout: 60


# Per ogni endpoint nella lista "registry_insecure_endpoints" viene generata una sezione del file di configurazione "10-local-registry.conf" 
# che segnala a Podman che quell'endpoint è insecure.