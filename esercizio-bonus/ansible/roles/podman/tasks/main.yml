- name: Installa i pacchetti Podman
  become: true
  ansible.builtin.dnf:
    name: "{{ podman_packages }}"
    state: present  
    update_cache: true
# Espone /run/podman/podman.sock: l'agent ci monterà sopra per buildare
# le immagini "fuori" dal proprio container (pattern Podman-out-of-Podman).
- name: Abilita e avvia il socket API di Podman
  become: true
  ansible.builtin.systemd:
    name: podman.socket
    enabled: true
    state: started

# Il socket appartiene a root, i processi dentro i container non sono lo stesso
# root dell'host e riceverebbero permission denied.
- name: Rende il socket Podman accessibile dai container
  become: true
  ansible.builtin.file:
    path: "{{ podman_host_socket }}"
    mode: "0666"